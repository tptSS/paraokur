{# Tüm sayfalarda ortak <head> parçası: tema, ikonlar, manifest, font ön yükleme, çekirdek CSS #}
<meta name="theme-color" content="#f2f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081a1f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ u('/assets/favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ u('/assets/brand/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ u('/site.webmanifest') }}">
<meta property="og:image" content="{{ site }}/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ cfg.site_name }}: paranın dilini sade öğren">
<meta name="twitter:card" content="summary_large_image">
<script>(function(){var d=document.documentElement,t=null;d.classList.add('js');try{t=localStorage.getItem('po-theme')}catch(e){}
if(t==='light'||t==='dark'){d.setAttribute('data-theme',t)}else if(matchMedia('(prefers-color-scheme: dark)').matches){d.setAttribute('data-theme','dark')}else{d.setAttribute('data-theme','light')}})();</script>
<link rel="preload" href="{{ u('/assets/fonts/bricolage-grotesque-tr.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ u('/assets/base.css') }}?v={{ build_id }}">
