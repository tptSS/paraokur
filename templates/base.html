<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ site }}{{ path }}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ site }}{{ path }}">
<meta property="og:site_name" content="{{ cfg.site_name }}">
<meta property="og:locale" content="tr_TR">
{% include "partials/head.html" %}
<link rel="stylesheet" href="{{ u('/assets/style.css') }}?v={{ build_id }}">
{% if cfg.adsense_client %}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ cfg.adsense_client }}" crossorigin="anonymous"></script>
{% endif %}
{% if cfg.ga_measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ cfg.ga_measurement_id }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ cfg.ga_measurement_id }}');</script>
{% endif %}
{% if jsonld %}
<script type="application/ld+json">{{ jsonld|tojson }}</script>
{% endif %}
</head>
<body>
{% include "partials/header.html" %}
<main id="icerik">
{% block main %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<script src="{{ u('/assets/site.js') }}?v={{ build_id }}"></script>
<script src="{{ u('/assets/app.js') }}?v={{ build_id }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
